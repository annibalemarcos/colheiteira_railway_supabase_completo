<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Colheiteira</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --ink: #18251c;
      --muted: #657266;
      --green: #16824b;
      --green-2: #25a064;
      --line: rgba(21, 45, 28, .12);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 12%, rgba(37, 160, 100, .22), transparent 28rem),
        radial-gradient(circle at 88% 8%, rgba(47, 111, 237, .13), transparent 26rem),
        linear-gradient(145deg, #edf6ee, #f8fbf8 56%, #eef4f0);
    }
    .login-shell { width: min(100%, 440px); }
    .login-card {
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 30px;
      background: rgba(255, 255, 255, .93);
      box-shadow: 0 28px 80px rgba(20, 40, 24, .16);
      backdrop-filter: blur(12px);
    }
    .brand-mark {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      color: var(--green);
      background: #e2f7eb;
      font-size: 1.7rem;
    }
    .form-control {
      min-height: 52px;
      border-radius: 15px;
      border-color: var(--line);
      padding-inline: 15px;
    }
    .form-control:focus {
      border-color: rgba(24, 130, 75, .5);
      box-shadow: 0 0 0 .25rem rgba(24, 130, 75, .12);
    }
    .btn-login {
      min-height: 52px;
      border: 0;
      border-radius: 15px;
      color: #fff;
      font-weight: 800;
      background: linear-gradient(135deg, var(--green), var(--green-2));
      box-shadow: 0 14px 28px rgba(24, 130, 75, .24);
    }
    .btn-login:hover { color: #fff; filter: brightness(.96); transform: translateY(-1px); }
    .muted { color: var(--muted); }
    .security-note {
      border-radius: 15px;
      padding: 12px 14px;
      color: #395443;
      background: rgba(226, 247, 235, .7);
      font-size: .88rem;
    }
  </style>
</head>
<body>
  <main class="login-shell">
    <section class="login-card">
      <div class="d-flex align-items-center gap-3 mb-4">
        <div class="brand-mark"><i class="bi bi-flower1"></i></div>
        <div>
          <h1 class="h3 fw-bold mb-1">Colheiteira</h1>
          <div class="muted">Acesso restrito ao painel</div>
        </div>
      </div>

      {% if error %}
      <div class="alert alert-danger rounded-4" role="alert">
        <i class="bi bi-exclamation-triangle me-1"></i> {{ error }}
      </div>
      {% endif %}

      <form method="post" action="{{ url_for('login') }}" autocomplete="on">
        <input type="hidden" name="next" value="{{ next_url }}">
        <div class="mb-3">
          <label class="form-label fw-semibold" for="username">Usuário</label>
          <input class="form-control" id="username" name="username" type="text" autocomplete="username" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold" for="password">Senha</label>
          <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-login w-100" type="submit">
          <i class="bi bi-shield-lock me-1"></i> Entrar
        </button>
      </form>

      <div class="security-note mt-4">
        <i class="bi bi-lock me-1"></i> A sessão expira após 12 horas ou ao clicar em sair.
      </div>
    </section>
  </main>
</body>
</html>
